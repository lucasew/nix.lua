[tools]

[tasks.install]
run = """
mise install
if [ -f package.json ]; then
    npm install
elif [ -f Cargo.toml ]; then
    cargo fetch
elif [ -f go.mod ]; then
    go mod download
elif [ -f requirements.txt ]; then
    pip install -r requirements.txt
elif [ -f shell.nix ]; then
    if command -v nix-shell >/dev/null 2>&1; then
        nix-shell --run "echo 'Nix environment prepared'"
    else
        echo "Warning: shell.nix found but nix-shell not installed"
    fi
else
    echo "No package manager detected."
fi
"""

[tasks.lint]
run = "PATH=$PWD/scripts:$PATH workspaced codebase lint"

[tasks.fmt]
run = "PATH=$PWD/scripts:$PATH workspaced codebase format"

[tasks.test]
run = "echo 'No tests configured'"

[tasks.codegen]
run = "echo 'No codegen'"

[tasks.ci]
depends = ["lint", "test"]
run = "true"
